        <div class="error-msg" id="errorMsg">
          <span>⊗</span><span id="errorText">Invalid credentials.</span>
        </div>

        <form id="loginForm" novalidate onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon">✉</span>
              <input
                class="form-input"
                type="email"
                id="email"
                placeholder="user@devflow.io"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input
                class="form-input"
                type="password"
                id="password"
                placeholder="••••••••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn-toggle-pw"
                id="togglePw"
                onclick="togglePassword()"
              >
                👁
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember" />
              Remember me
            </label>
            <a href="#" class="link-forgot" onclick="forgotPassword(event)"
              >Forgot password?</a
            >
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Sign In →</span>
            <span class="btn-loading"
              ><span class="spinner"></span> Authenticating...</span
            >
          </button>
        </form>

        <div class="card-footer">
          Don't have an account? <a href="register.html">Create one</a>
        </div>

      <div class="status-strip">
        <span class="status-dot"></span>
        <span class="status-text">All systems operational</span>
        <span class="status-sep">|</span>
        <span>TLS 1.3 Encrypted</span>
        <span class="status-right">DevFlow v1.0.4</span>
      </div>
    </div>

    <script>
      const PARTICLES = [
        'const',
        'fn()',
        '=> {}',
        'async',
        'await',
        'return',
        '401',
        'JWT',
        'Bearer',
        'POST',
        '200 OK',
        'fetch()',
        'auth',
        '🔐',
        'import',
        'export',
        'true',
        '&&',
        'null',
      ];

      function togglePassword() {
        const pw = document.getElementById('password');
        const btn = document.getElementById('togglePw');
        pw.type = pw.type === 'password' ? 'text' : 'password';
        btn.textContent = pw.type === 'password' ? '👁' : '🙈';
      }

      function showError(msg) {
        const box = document.getElementById('errorMsg');
        document.getElementById('errorText').textContent = msg;
        box.classList.remove('visible');
        void box.offsetWidth;
        box.classList.add('visible');
      }
      function hideError() {
        document.getElementById('errorMsg').classList.remove('visible');
      }

      async function handleLogin(e) {
        e.preventDefault();
        hideError();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');

        if (!email || !password) return showError('Please fill in all fields.');

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
          return showError('Please enter a valid email address.');

        btn.classList.add('loading');
        btn.disabled = true;

        try {
          const res = await fetch('http://localhost:3000/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();

          if (!res.ok) throw new Error(data.message || 'Login failed');

          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.data.user));

          window.location.href = 'home.html';
        } catch (err) {
          showError(err.message || 'Authentication failed. Please try again.');
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      }

      // ── OAuth placeholder ──────────────────────────────────────────
      function oauthLogin(e, provider) {
        e.preventDefault();
        // window.location.href = `/api/v1/auth/${provider.toLowerCase()}`;
        alert(`${provider} OAuth — ربطه بالـ backend لما تحتاجه`);
      }

      function forgotPassword(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
          showError('Enter your email first.');
          return;
        }
        alert(
          `Reset link sent to: ${email}\n(اعمل /api/v1/auth/forgot-password لما تحتاجه)`,
        );
      }

      ['email', 'password'].forEach((id) =>
        document.getElementById(id).addEventListener('input', hideError),
      );
    </script>
