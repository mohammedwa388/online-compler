<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevFlow IDE — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-base: #0d0f14; --bg-card: #13161e; --bg-input: #1a1e28;
        --border: #252a38; --border-focus: #3b82f6;
        --accent: #3b82f6; --accent-glow: rgba(59,130,246,0.35);
        --accent-2: #06b6d4; --text-primary: #e2e8f0;
        --text-muted: #64748b; --text-dim: #94a3b8;
        --success: #22c55e; --error: #ef4444; --warning: #f59e0b;
        --mono: 'JetBrains Mono', monospace; --sans: 'Space Grotesk', sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--sans); background: var(--bg-base); color: var(--text-primary);
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        overflow: hidden; position: relative;
      }
      body::before {
        content: ''; position: fixed; inset: 0;
        background-image:
          linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
        background-size: 40px 40px; pointer-events: none; z-index: 0;
      }
      .bg-glow { position:fixed;border-radius:50%;filter:blur(100px);opacity:.45;pointer-events:none;z-index:0;animation:pulse-glow 6s ease-in-out infinite alternate; }
      .bg-glow--1 { width:600px;height:600px;background:radial-gradient(circle,#1d4ed8 0%,transparent 70%);top:-200px;left:-150px; }
      .bg-glow--2 { width:500px;height:500px;background:radial-gradient(circle,#0e7490 0%,transparent 70%);bottom:-180px;right:-120px;animation-delay:3s; }
      @keyframes pulse-glow { from{opacity:.3;transform:scale(1)} to{opacity:.55;transform:scale(1.08)} }
      .particles { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
      .particle { position:absolute;font-family:var(--mono);font-size:11px;color:var(--accent);opacity:0;animation:float-up linear infinite;user-select:none; }
      @keyframes float-up { 0%{opacity:0;transform:translateY(0) rotate(0deg)} 10%{opacity:.18} 90%{opacity:.12} 100%{opacity:0;transform:translateY(-100vh) rotate(20deg)} }
      .login-wrapper { position:relative;z-index:1;width:100%;max-width:460px;padding:20px;animation:slide-in .6s cubic-bezier(.22,.68,0,1.2) both; }
      @keyframes slide-in { from{opacity:0;transform:translateY(30px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
      .brand { text-align:center;margin-bottom:32px; }
      .brand-logo { display:inline-flex;align-items:center;gap:10px;margin-bottom:8px; }
      .brand-icon { width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 20px var(--accent-glow); }
      .brand-name { font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.5px; }
      .brand-name span { color:var(--accent); }
      .brand-tagline { font-size:13px;color:var(--text-muted);font-family:var(--mono);letter-spacing:.5px; }
      .card { background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(59,130,246,.06),0 32px 64px rgba(0,0,0,.5);position:relative;overflow:hidden; }
      .card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);opacity:.8; }
      .card-title { font-size:20px;font-weight:600;margin-bottom:4px; }
      .card-sub { font-size:13px;color:var(--text-muted);margin-bottom:28px; }
      .term-crumb { font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-bottom:24px;display:flex;align-items:center;gap:6px; }
      .term-crumb .path { color:var(--accent-2); }
      .term-crumb .cursor { display:inline-block;width:7px;height:13px;background:var(--accent);animation:blink .8s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .oauth-buttons { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px; }
      .btn-oauth { display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text-primary);font-size:13px;font-family:var(--sans);cursor:pointer;text-decoration:none;transition:border-color .2s,background .2s; }
      .btn-oauth:hover { border-color:var(--border-focus);background:#1f2433; }
      .btn-oauth svg { width:16px;height:16px; }
      .divider { text-align:center;font-size:11px;color:var(--text-muted);font-family:var(--mono);letter-spacing:.5px;margin:20px 0;position:relative; }
      .divider::before,.divider::after { content:'';position:absolute;top:50%;width:calc(50% - 90px);height:1px;background:var(--border); }
      .divider::before{left:0} .divider::after{right:0}
      .error-msg { background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--error);margin-bottom:16px;display:none;align-items:center;gap:8px; }
      .error-msg.visible { display:flex; }
      .form-group { margin-bottom:18px; }
      .form-label { display:block;font-size:12px;font-weight:500;color:#94a3b8;margin-bottom:6px;font-family:var(--mono);letter-spacing:.3px; }
      .input-wrap { position:relative; }
      .input-icon { position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none; }
      .form-input { width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:11px 12px 11px 38px;color:var(--text-primary);font-size:14px;font-family:var(--mono);outline:none;transition:border-color .2s,box-shadow .2s; }
      .form-input:focus { border-color:var(--border-focus);box-shadow:0 0 0 3px var(--accent-glow); }
      .btn-toggle-pw { position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px;color:var(--text-muted); }
      .form-row { display:flex;align-items:center;justify-content:space-between;margin-bottom:20px; }
      .checkbox-label { display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);cursor:pointer; }
      .checkbox-label input { accent-color:var(--accent);cursor:pointer; }
      .link-forgot { font-size:13px;color:var(--accent);text-decoration:none; }
      .link-forgot:hover { text-decoration:underline; }
      .btn-submit { width:100%;padding:13px;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:15px;font-weight:600;font-family:var(--sans);position:relative;overflow:hidden;transition:opacity .2s,transform .1s; }
      .btn-submit:hover:not(:disabled) { opacity:.92;transform:translateY(-1px); }
      .btn-submit:disabled { opacity:.6;cursor:not-allowed; }
      .btn-text { display:block; }
      .btn-loading { display:none;align-items:center;justify-content:center;gap:8px; }
      .btn-submit.loading .btn-text { display:none; }
      .btn-submit.loading .btn-loading { display:flex; }
      .spinner { width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite; }
      @keyframes spin { to{transform:rotate(360deg)} }
      .card-footer { text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted); }
      .card-footer a { color:var(--accent);text-decoration:none; }
      .card-footer a:hover { text-decoration:underline; }
      .status-strip { margin-top:16px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);font-family:var(--mono); }
      .status-dot { width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);animation:pulse-dot 2s ease-in-out infinite; }
      @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
      .status-sep { color:var(--border); }
      .status-right { margin-left:auto; }
    </style>
  </head>
  <body>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>
    <div class="particles" id="particles"></div>

    <div class="login-wrapper">
      <div class="brand">
        <div class="brand-logo">
          <div class="brand-icon">⚡</div>
          <span class="brand-name">Dev<span>Flow</span></span>
        </div>
        <p class="brand-tagline">// authenticate.init()</p>
      </div>

      <div class="card">
        <div class="term-crumb">
          <span>~</span><span class="path">/devflow/auth/login</span>
          <span class="cursor"></span>
        </div>

        <h1 class="card-title">Welcome back</h1>
        <p class="card-sub">Sign in to continue to your workspace.</p>

        <div class="oauth-buttons">
          <a href="#" class="btn-oauth" onclick="oauthLogin(event,'GitHub')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.57v-2c-3.34.72-4.04-1.6-4.04-1.6-.54-1.37-1.33-1.74-1.33-1.74-1.08-.75.08-.73.08-.73 1.2.08 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18.77.84 1.23 1.9 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .31.2.68.82.56C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </a>
          <a href="#" class="btn-oauth" onclick="oauthLogin(event,'Google')">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.7 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.56c-.28 1.5-1.13 2.77-2.4 3.62v3h3.87c2.27-2.1 3.57-5.18 3.57-8.65z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3c-1.07.72-2.44 1.15-4.06 1.15-3.12 0-5.77-2.11-6.72-4.95H1.3v3.1A11.99 11.99 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.28 14.29A7.23 7.23 0 0 1 4.9 12c0-.79.13-1.56.38-2.29V6.61H1.3A11.99 11.99 0 0 0 0 12c0 1.93.46 3.76 1.3 5.39l3.98-3.1z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.6 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A11.99 11.99 0 0 0 1.3 6.61l3.98 3.1C6.23 6.86 8.88 4.75 12 4.75z"/></svg>
            Google
          </a>
        </div>

        <div class="divider">OR CONTINUE WITH EMAIL</div>

        <div class="error-msg" id="errorMsg">
          <span>⊗</span><span id="errorText">Invalid credentials.</span>
        </div>

        <form id="loginForm" novalidate onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon">✉</span>
              <input class="form-input" type="email" id="email" placeholder="user@devflow.io" autocomplete="email" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input class="form-input" type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" required />
              <button type="button" class="btn-toggle-pw" id="togglePw" onclick="togglePassword()">👁</button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember" />
              Remember me
            </label>
            <a href="#" class="link-forgot" onclick="forgotPassword(event)">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">Sign In →</span>
            <span class="btn-loading"><span class="spinner"></span> Authenticating...</span>
          </button>
        </form>

        <div class="card-footer">
          Don't have an account? <a href="register.html">Create one</a>
        </div>
      </div>

      <div class="status-strip">
        <span class="status-dot"></span>
        <span class="status-text">All systems operational</span>
        <span class="status-sep">|</span>
        <span>TLS 1.3 Encrypted</span>
        <span class="status-right">DevFlow v1.0.4</span>
      </div>
    </div>

    <script>
      // ── Particles ─────────────────────────────────────────────────
      const PARTICLES = ['const','fn()','=> {}','async','await','return','401','JWT','Bearer','POST','200 OK','fetch()','auth','🔐','import','export','true','&&','null'];
      document.getElementById('particles') && PARTICLES.forEach(txt => {
        const el = document.createElement('span');
        el.className = 'particle';
        el.textContent = txt;
        el.style.cssText = `left:${Math.random()*100}%;bottom:-40px;animation-duration:${10+Math.random()*15}s;animation-delay:${Math.random()*12}s;font-size:${10+Math.random()*5}px;`;
        document.getElementById('particles').appendChild(el);
      });

      // ── Toggle password ────────────────────────────────────────────
      function togglePassword() {
        const pw  = document.getElementById('password');
        const btn = document.getElementById('togglePw');
        pw.type = pw.type === 'password' ? 'text' : 'password';
        btn.textContent = pw.type === 'password' ? '👁' : '🙈';
      }

      // ── Error helpers ──────────────────────────────────────────────
      function showError(msg) {
        const box = document.getElementById('errorMsg');
        document.getElementById('errorText').textContent = msg;
        box.classList.remove('visible');
        void box.offsetWidth;
        box.classList.add('visible');
      }
      function hideError() {
        document.getElementById('errorMsg').classList.remove('visible');
      }

      // ── handleLogin — متصل بالـ backend ───────────────────────────
      async function handleLogin(e) {
        e.preventDefault();
        hideError();

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('submitBtn');

        if (!email || !password) return showError('Please fill in all fields.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email address.');

        btn.classList.add('loading');
        btn.disabled = true;

        try {
          // ══ الاتصال بالـ backend ══
          const res  = await fetch('/api/v1/auth/login', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ email, password }),
          });
          const data = await res.json();

          if (!res.ok) throw new Error(data.message || 'Login failed');

          // حفظ الـ token وبيانات اليوزر
          localStorage.setItem('token', data.token);
          localStorage.setItem('user',  JSON.stringify(data.data.user));

          // redirect للـ IDE
          window.location.href = 'ideBoard.html';

        } catch (err) {
          showError(err.message || 'Authentication failed. Please try again.');
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      }

      // ── OAuth placeholder ──────────────────────────────────────────
      function oauthLogin(e, provider) {
        e.preventDefault();
        // window.location.href = `/api/v1/auth/${provider.toLowerCase()}`;
        alert(`${provider} OAuth — ربطه بالـ backend لما تحتاجه`);
      }

      // ── Forgot password placeholder ────────────────────────────────
      function forgotPassword(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) { showError('Enter your email first.'); return; }
        alert(`Reset link sent to: ${email}\n(اعمل /api/v1/auth/forgot-password لما تحتاجه)`);
      }

      // ── Clear error on typing ──────────────────────────────────────
      ['email','password'].forEach(id =>
        document.getElementById(id).addEventListener('input', hideError)
      );
    </script>
  </body>
</html>
